initial_policy:
  id: local_eight_agent_discretion_v1
  approved: true
  policy_version: 3
  effective_day: 1
  review_day: 50
  allocation_mode: agent_discretion
  protocol: 'You decide using only completed market data through D-1, then the engine
    executes at unseen day-D opens with costs. All 29 stocks may be considered. Your
    strategy is a research style, not an engine-enforced stock filter. Choose BUY
    notional amounts, SELL quantities and total cash reserve yourself. There is no
    fixed10%,18% or7% starter, no one/two-position ceiling, and no minimum idle cash.
    You may use the available capital across positions within the common hard limits
    (all29 stocks available, up to100% in one stock or across the portfolio, long-only,
    no borrowing, up to58 order intents per day); these are ceilings, not targets.
    Existing positions can be increased, reduced or sold. Additions need fresh evidence,
    not merely a desire to recover losses. Cash can be reserved for uncertainty or
    a concrete conditional opportunity, with an observable release condition and a
    reason for the amount. Do not invent future news or price moves. Rank indicators
    are information rather than mandatory picks. Explain each position size and cash
    plan. No hindsight winner list or prior-run learned rules is available. Recent
    episodes are observations, not permanent allocation ceilings. The initial strategy
    style stays fixed during this comparison; reflection proposals are archived for
    independent review rather than silently rewriting the policy. All agents are technically
    expert: reason about trend, momentum, mean reversion, volatility, drawdown, correlation/concentration,
    volume, portfolio construction, position sizing, exit design and transaction costs.
    These are tools of judgment, not compulsory indicator gates. Fundamentals/news
    are absent; do not invent them. The shared financial objective is to outperform
    the buy-and-hold stock basket net of trading costs by day500. No performance-based
    removal occurs before500; scheduled reviews do not terminate underperformers.
    The old30% loss termination rule is removed; insolvent portfolios cannot spend
    money they do not have.'
