experiment_id: demo
start_date: '2024-01-01'
end_date: '2024-10-31'
lookback_days: 120
n_sim_days: 50
anonymize:
  seed: 20260904
  price_scale_range:
  - 0.4
  - 2.5
  volume_scale_range:
  - 0.5
  - 2.0
capital:
  starting_cash: 1000000
  death_threshold_frac: 0.0
costs:
  brokerage_per_order: 20.0
  stt_delivery_frac: 0.001
  exchange_txn_frac: 3.25e-05
  gst_on_brokerage_frac: 0.18
  stamp_duty_buy_frac: 0.00015
  slippage_frac: 0.0005
risk:
